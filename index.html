<!DOCTYPE HTML>
<html>
<head>
  <title>iamYoshi's Offical Website Only In The World - Links</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div id="autoplay-policy-notice">
# I can use Vimeo instead of local files so I can bypass the default browser autoplay policy, which requires user interaction to start audio playback. By using Vimeo's player, I can set the video to autoplay and loop without being muted, and then unmute it on the first user interaction.
</div>

<div id="enter-overlay" class="splash-screen">
  <div class="enter-content">
    <button id="enter-btn">CLICK TO ENTER</button>
  </div>
</div>

<div class="video-background-container">
  <div class="video-background" id="vimeo-player">
    </div>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  // The exact sequence of numbers extracted from your layout, boss man!
  const videoSequence = [
    1194070125, // First video
    1194831059, // Second video (Playboi Carti - Celine Molly My Bean [guitar cover])
    1194831731  // Third video (Playboi Carti - Molly (Destxmido Remix))
  ];

  let currentTrackIndex = 0;

  // Configuration options for background autoplay execution
  const options = {
    id: videoSequence[currentTrackIndex],
    autoplay: true,
    muted: true, // Must start at 1 to smash through the browser policy blocks
    loop: false, // Turned off loop here so it triggers our sequential 'ended' logic instead!
    background: true,
    responsive: true
  };

  // Grab the iframe element by its ID (Instantiate the video logic engine)
  const playerContainer = document.getElementById('vimeo-player');
  const player = new Vimeo.Player(playerContainer, options);

  // Grab our new UI interaction elements
  const enterOverlay = document.getElementById('enter-overlay');
  const enterBtn = document.getElementById('enter-btn');

  // Triggered the absolute instant the user smashes that enter control
  enterBtn.addEventListener('click', function() {
    // 1. Smash the overlay completely out of sight
    enterOverlay.classList.add('fade-out');
    
    // Completely remove it from layout calculations once the fade animation wraps up
    setTimeout(function() {
      enterOverlay.style.display = 'none';
    }, 500); // Matches the 0.5s CSS transition speed perfectly

    // 2. Unmute the audio sequence tracking array
    player.setMuted(0).then(function() {
      // Audio engine is now fully live and unmuted, play the sequence!
      player.play();
    }).catch(function(error) {
      console.error('Shit, audio initialization failed:', error);
      // Fallback play trigger just in case
      player.play();
    });
  });

  // The core automated sequencing engine
  player.on('ended', function() {
    currentTrackIndex++;
    
    // Check if there are still numbers remaining in our sequence array
    if (currentTrackIndex < videoSequence.length) {
      player.loadVideo(videoSequence[currentTrackIndex]).then(function() {
        // Fuck yeah, next track loaded into slot.
        player.play();
        player.setMuted(0); // Keeping the audio line open and hot
      }).catch(function(error) {
        console.error('Shit, next video failed to load:', error);
      });
    } else {
      // Loop back to the very first number (index 0) to keep the background infinite!
      currentTrackIndex = 0;
      player.loadVideo(videoSequence[currentTrackIndex]).then(function() {
        player.play();
        player.setMuted(0);
      });
    }
  });
</script>

</body>
</html>
